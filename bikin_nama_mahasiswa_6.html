<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <table border="1">
    <thead>
      <tr>
        <th>NIM</th>
        <th>Nama</th>
        <th>Prodi</th>
        <th>Gender</th>
        <th>Alamat</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="table-mhs">


      <!-- Datanya akan dirended di sini -->

    </tbody>
  </table>

  <script>
    //  data mahasiswa pake arrat
    const students = [
      {
        nim: "123456789",
        nama: "Budi",
        prodi: "Teknik Informasi",
        gender: "laki-laki",
        alamat: "Tanah Abang",

      },
      {
        nim: "123456789",
        nama: "Susi",
        prodi: "Bahasa Indonesia",
        gender: "Perempuan",
        alamat: "Sunter",
      },
    ];

    let table_mhs = document.getElementById("table-mhs");

    function renderData() {
      table_mhs.innerHTML = '';
      for (let i = 0; i < students.length; i++) {
        let baris = document.createElement("tr");
        baris.innerHTML = `
      <td>${students[i].nim}</td>
      <td>${students[i].nama}</td>
      <td>${students[i].prodi}</td>
      <td>${students[i].gender}</td>
      <td>${students[i].alamat}</td>
      <td>
        <button class="btn-hapus" data-hapus="${i}"> hapus </button>
        </td>
      `;
        table_mhs.appendChild(baris);
      }

    }

    table_mhs.innerHTML = '';
    for (let i = 0; i < students.length; i++) {
      let baris = document.createElement("tr");
      baris.innerHTML = `
      <td>${students[i].nim}</td>
      <td>${students[i].nama}</td>
      <td>${students[i].prodi}</td>
      <td>${students[i].gender}</td>
      <td>${students[i].alamat}</td>
      <td>
        <button class="btn-hapus" data-hapus="${i}"> hapus </button>
        </td>
      `;
      table_mhs.appendChild(baris);
    }
    // Aksi hapus
    table_mhs.addEventListener("click", function (e) {
      if (e.target.classList.contains("btn-hapus")) {
        let indexData = e.target.getAttribute("data-hapus");
        students.splice(indexData, 1);
        renderData();
      }
    });

    renderData();

  </script>


</body>

</html>
