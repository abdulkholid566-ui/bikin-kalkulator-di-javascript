<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator</title>
</head>

<body>
  <form action="" method="post" onsubmit="return false">
    <input type="number" id="angka1" value="">
    <select id="operator" required>
      <option value="">--pilih dulu operator--</option>
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>

    <input type="number" id="angka2">

    <button onclick="hasilHitungan()"> Hasil Hitungan</button>
  </form>

  <p id="hasil">hasilnya adalah : 0</p>

  <script>

    function hasilHitungan() {
      let nomor1 = parseFloat(document.getElementById("angka1").value);
      let nomor2 = parseFloat(document.getElementById("angka2").value);
      let opt = document.getElementById("operator").value;
      let hasil = 0;

      //   if (isNaN(nomor1) || isNaN(nomor2)) {
      //     return alert("Masukan Angkanya");
      //   }
      //   if (opt == "+") {
      //     hasil = nomor1 + nomor2;
      //   } else if (opt == "-") {
      //     hasil = nomor1 - nomor2;
      //   }
      //   else if (opt == "*") {
      //     hasil = nomor1 * nomor2;
      //   }
      //   else if (opt == "/") {
      //     hasil = (nomor1 == 0 && nomor2 == 0) ? '"0 tidak bisa dibagi 0"' :
      //       (nomor2 == 0) ? "error" : nomor1 / nomor2;
      //   }
      //   else {
      //     hasil = 0;
      //   }

      switch (opt) {
        case "+":
          hasil = nomor1 + nomor2;
          break;
        case "-":
          hasil = nomor1 - nomor2;
          break;
        case "*":
          hasil = nomor1 * nomor2;
          break;
        case "/":
          hasil = (nomor1 == 0 && nomor2 == 0) ? '"0 tidak bisa dibagi 0"' :
            (nomor2 == 0) ? "error" : nomor1 / nomor2;
          break;
        default:
          break;
      }



      document.getElementById("hasil").innerHTML = `hasilnya adalah:${hasil}`;
    }

  </script>
</body>

</html>
